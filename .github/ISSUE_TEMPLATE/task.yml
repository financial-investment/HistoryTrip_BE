name: Task
description: 작업 이슈를 등록합니다.
title: "[Task] "
labels: ["task"]
body:
  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 어떤 작업을 해야 하는지 간단히 작성해주세요.
      placeholder: 예) 관광지 검색 API 구현
    validations:
      required: true

  - type: textarea
    id: checklist
    attributes:
      label: 작업 목록
      description: 필요한 작업을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] Controller 구현
        - [ ] Service 로직 작성
        - [ ] 테스트
    validations:
      required: true

  - type: textarea
    id: note
    attributes:
      label: 참고 사항
      description: 관련 문서, 화면, API, 주의사항이 있다면 작성해주세요.
      placeholder: 예) 로그인하지 않은 사용자도 검색 가능해야 함
    validations:
      required: false